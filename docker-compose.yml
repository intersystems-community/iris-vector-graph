# iris-vector-graph — IRIS Community Edition
#
# Starts IRIS Community with the SuperServer (for the Python driver) and the Management Portal published on the
# host. No license required. Default credentials: _SYSTEM / SYS
#
# Usage:
#   docker compose up -d        # Start IRIS in the background
#   docker compose ps           # The container's name (compose names it <project>-iris-1) and its ports
#   docker compose exec iris iris session IRIS -U USER    # An IRIS terminal, whatever the container is called
#   docker compose down         # Stop and remove container (data is preserved in iris_data volume)
#   docker compose down -v      # Stop and wipe all data
#
# Host ports default to IRIS's own, 1972 and 52773. When an IRIS on this machine already holds them, pick others:
#   IVG_IRIS_PORT=11972 IVG_WEB_PORT=15773 docker compose up -d
# and connect to the SuperServer port you chose.
#
# Community Edition limits the CPU cores it runs on and ignores a mounted iris.key. On a host with more cores than it
# allows (a 64-core server, for one) it logs "Too many Cores" and shuts down, and the service shows unhealthy. Pin it
# in a compose.override.yml beside this file:
#   services:
#     iris:
#       cpuset: "0-7"

services:
  iris:
    # The official image, pinned. intersystemsdc/iris-community:latest-em moved to a
    # build whose entrypoint cannot create the namespace ("Cannot call an iris.package
    # wrapper ... dbapi.connect") and exits. USER exists here out of the box, and the
    # command below keeps _SYSTEM / SYS from expiring.
    image: containers.intersystems.com/intersystems/iris-community:2026.1
    ports:
      - "${IVG_IRIS_PORT:-1972}:1972"   # IRIS SuperServer — used by the iris_vector_graph Python SDK
      - "${IVG_WEB_PORT:-52773}:52773"  # IRIS Management Portal — http://localhost:52773/csp/sys/UtilHome.csp
    volumes:
      - iris_data:/usr/irissys/mgr
      - ./sql:/home/irisowner/sql
    stdin_open: true
    tty: true
    # The check fails as soon as IRIS is down (`iris stop` included); after 3 failures, about 30 s, `docker compose ps`
    # says unhealthy. A first start has 60 s before failures count.
    healthcheck:
      test: ["CMD", "/usr/irissys/bin/iris", "session", "iris", "-U%SYS", "##class(%SYSTEM.Process).CurrentDirectory()"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 60s
    command: --check-caps false -a "iris session iris -U%SYS '##class(Security.Users).UnExpireUserPasswords(\"*\")'"

volumes:
  iris_data: {}
